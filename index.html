<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCC Island Player Counts</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    :root {
      --bg-color: #0f1117;
      --card-bg: #1a1d24;
      --border-color: #272b35;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 20px;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .status-text {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .btn {
      background: #20242c;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn:hover {
      background: #2a303c;
      border-color: #38bdf8;
    }

    /* 3x3 Grid Layout */
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    @media (max-width: 1024px) {
      .grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .stats-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .badge {
      font-size: 0.75rem;
      padding: 2px 7px;
      border-radius: 4px;
      background: #252a34;
      color: var(--text-muted);
    }

    .badge span {
      color: var(--text-main);
      font-weight: 600;
    }

    .badge.current {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .chart-container {
      position: relative;
      height: 170px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>MCC Island — Queue Tracker</h1>
        <div class="status-text" id="status">Loading data...</div>
      </div>
      <button class="btn" id="tz-toggle">Time: Local</button>
    </header>

    <div class="grid" id="charts-grid"></div>
  </div>

  <script>
    const DATA_URL = "mcci_player_counts.jsonl";
    let useUTC = false;
    let chartInstances = [];
    let lastTimestamp = null;

    // Detect user's local timezone abbreviation (e.g. EDT, PST, BST, GMT+2)
    const localTzName = new Intl.DateTimeFormat([], { timeZoneName: 'short' })
      .formatToParts(new Date())
      .find(p => p.type === 'timeZoneName')?.value || 'Local';

    const COLOR_PALETTE = [
      "#38bdf8", // Sky Blue
      "#fb923c", // Orange
      "#4ade80", // Green
      "#f87171", // Red
      "#c084fc", // Purple
      "#fb7185", // Rose
      "#facc15", // Yellow
      "#94a3b8", // Slate
      "#a3e635"  // Lime
    ];

    function formatQueueName(name) {
      if (name === "tgttos") return "TGTTOS";
      return name.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function updateStatusText() {
      if (!lastTimestamp) return;
      const statusEl = document.getElementById("status");
      const timeStr = useUTC
        ? lastTimestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + " UTC"
        : lastTimestamp.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
      statusEl.textContent = `Showing 9 queues sorted by average • Last updated: ${timeStr}`;
    }

    const tzBtn = document.getElementById("tz-toggle");
    tzBtn.textContent = `Time: ${localTzName}`;

    tzBtn.addEventListener("click", () => {
      useUTC = !useUTC;
      tzBtn.textContent = useUTC ? "Time: UTC" : `Time: ${localTzName}`;
      updateStatusText();
      chartInstances.forEach(chart => chart.update());
    });

    async function initDashboard() {
      const statusEl = document.getElementById("status");
      const gridEl = document.getElementById("charts-grid");

      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const text = await response.text();
        const lines = text.trim().split("\n").filter(Boolean);

        if (lines.length === 0) {
          statusEl.textContent = "No data points found.";
          return;
        }

        const queueMap = {};
        const timestamps = [];

        lines.forEach(line => {
          const entry = JSON.parse(line);
          const t = new Date(entry.timestamp);
          timestamps.push(t);

          for (const [queue, count] of Object.entries(entry.counts || {})) {
            if (!queueMap[queue]) queueMap[queue] = [];
            queueMap[queue].push({ x: t, y: count });
          }
        });

        // Compute metrics (Avg, Peak, Latest) for sorting
        const queueList = Object.entries(queueMap).map(([name, dataPoints]) => {
          const counts = dataPoints.map(p => p.y);
          const sum = counts.reduce((acc, v) => acc + v, 0);
          const avg = sum / counts.length;
          const peak = Math.max(...counts);
          const latest = counts[counts.length - 1];

          return { name, dataPoints, avg, peak, latest };
        });

        // Sort descending by average player count
        queueList.sort((a, b) => b.avg - a.avg);

        lastTimestamp = timestamps[timestamps.length - 1];
        updateStatusText();

        // Render each card and chart
        queueList.forEach((queue, index) => {
          const color = COLOR_PALETTE[index % COLOR_PALETTE.length];
          const canvasId = `chart-${index}`;

          // Create DOM card element
          const card = document.createElement("div");
          card.className = "card";
          card.innerHTML = `
            <div class="card-header">
              <div>
                <div class="card-title">${formatQueueName(queue.name)}</div>
                <div class="stats-badges">
                  <div class="badge current">Now: <span>${queue.latest}</span></div>
                  <div class="badge">Avg: <span>${queue.avg.toFixed(1)}</span></div>
                  <div class="badge">Peak: <span>${queue.peak}</span></div>
                </div>
              </div>
            </div>
            <div class="chart-container">
              <canvas id="${canvasId}"></canvas>
            </div>
          `;
          gridEl.appendChild(card);

          // Instantiate Chart.js
          const ctx = document.getElementById(canvasId).getContext("2d");
          const chart = new Chart(ctx, {
            type: "line",
            data: {
              datasets: [{
                data: queue.dataPoints,
                borderColor: color,
                backgroundColor: color + "18", // subtle 10% alpha fill
                fill: true,
                borderWidth: 1.8,
                pointRadius: 0,
                pointHoverRadius: 4,
                tension: 0.2
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              interaction: {
                mode: "index",
                intersect: false
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: "#20242c",
                  titleColor: "#f0f3f6",
                  bodyColor: "#f0f3f6",
                  borderColor: "#2d333f",
                  borderWidth: 1,
                  displayColors: false,
                  callbacks: {
                    title: context => {
                      if (!context.length) return '';
                      const d = new Date(context[0].parsed.x);
                      return useUTC
                        ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' }) + ' UTC'
                        : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZoneName: 'short' });
                    },
                    label: context => `Players: ${context.parsed.y}`
                  }
                }
              },
              scales: {
                x: {
                  type: "time",
                  time: {
                    unit: "hour",
                    displayFormats: { hour: "HH:mm" }
                  },
                  grid: { color: "#232732" },
                  ticks: {
                    color: "#6b7280",
                    maxRotation: 0,
                    font: { size: 10 },
                    callback: function(val) {
                      const d = new Date(val);
                      return useUTC
                        ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' })
                        : d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    }
                  }
                },
                y: {
                  beginAtZero: true,
                  grid: { color: "#232732" },
                  ticks: {
                    color: "#6b7280",
                    precision: 0,
                    font: { size: 10 },
                    maxTicksLimit: 5
                  }
                }
              }
            }
          });

          chartInstances.push(chart);
        });

      } catch (err) {
        statusEl.textContent = `Error loading data: ${err.message}`;
      }
    }

    initDashboard();
  </script>
</body>
</html>
