<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MCC Island Player Counts</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
  <style>
    :root {
      --bg-color: #12151e;
      --card-bg: #1c212d;
      --border-color: #2b3244;
      --text-main: #f0f3f6;
      --text-muted: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 24px 16px;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .status-text {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* Menu Layout Hierarchy */
    .menu-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .game-row {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    /* Row 1 and 3 (3 games centered) */
    .row-3 .card {
      flex: 1 1 340px;
      max-width: 420px;
    }

    /* Row 2 (4 games) */
    .row-4 .card {
      flex: 1 1 270px;
      max-width: 330px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .card:hover {
      border-color: #424d66;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .card-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
    }

    .stats-badges {
      display: flex;
      gap: 5px;
    }

    .badge {
      font-size: 0.72rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: #252c3d;
      color: var(--text-muted);
    }

    .badge span {
      color: var(--text-main);
      font-weight: 600;
    }

    .badge.current {
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
    }

    .chart-container {
      position: relative;
      height: 125px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>MCC Island — Queue Tracker</h1>
        <div class="status-text" id="status">Loading queue data...</div>
      </div>
    </header>

    <div class="menu-layout" id="menu-layout"></div>
  </div>

  <script>
    const DATA_URL = "mcci_player_counts.jsonl";

    // Exact layout matching the in-game GUI
    const MENU_ROWS = [
      // Row 1 (3 items centered)
      [
        { id: "sky_battle_quads", name: "Sky Battle", color: "#f59e0b" },
        { id: "sky_battle_solos", name: "Sky Battle Solo", color: "#a855f7" },
        { id: "battle_box_quads", name: "Battle Box", color: "#84cc16" }
      ],
      // Row 2 (4 items)
      [
        { id: "dynaball", name: "Dynaball", color: "#38bdf8" },
        { id: "tgttos", name: "To Get To The Other Side", color: "#f43f5e" },
        { id: "hole_in_the_wall", name: "Hole in the Wall", color: "#22c55e" },
        { id: "battle_box_arena", name: "Battle Box Arena", color: "#ef4444" }
      ],
      // Row 3 (3 items centered)
      [
        { id: "parkour_warrior_survival", name: "Parkour Warrior Survivor", color: "#4ade80" },
        { id: "rocket_spleef", name: "Rocket Spleef Rush", color: "#ea580c" },
        { id: "parkour_warrior_dojo", name: "Parkour Warrior Dojo", color: "#eab308" }
      ]
    ];

    async function initDashboard() {
      const statusEl = document.getElementById("status");
      const layoutEl = document.getElementById("menu-layout");

      try {
        const response = await fetch(DATA_URL);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const text = await response.text();
        const lines = text.trim().split("\n").filter(Boolean);

        if (lines.length === 0) {
          statusEl.textContent = "No data points found.";
          return;
        }

        const queueMap = {};
        const timestamps = [];

        lines.forEach(line => {
          const entry = JSON.parse(line);
          const t = new Date(entry.timestamp);
          timestamps.push(t);

          for (const [queue, count] of Object.entries(entry.counts || {})) {
            if (!queueMap[queue]) queueMap[queue] = [];
            queueMap[queue].push({ x: t, y: count });
          }
        });

        const lastUpdated = timestamps[timestamps.length - 1].toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        statusEl.textContent = `Last updated: ${lastUpdated} • Synced to in-game menu`;

        // Build each row
        MENU_ROWS.forEach((row, rowIndex) => {
          const rowEl = document.createElement("div");
          rowEl.className = `game-row ${row.length === 3 ? "row-3" : "row-4"}`;

          row.forEach((game, gameIndex) => {
            const dataPoints = queueMap[game.id] || [];
            const counts = dataPoints.map(p => p.y);
            const sum = counts.reduce((acc, v) => acc + v, 0);
            const avg = counts.length ? (sum / counts.length).toFixed(1) : "0.0";
            const peak = counts.length ? Math.max(...counts) : 0;
            const latest = counts.length ? counts[counts.length - 1] : 0;

            const canvasId = `chart-${rowIndex}-${gameIndex}`;

            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
              <div class="card-header">
                <div class="card-title-group">
                  <div class="color-dot" style="background-color: ${game.color};"></div>
                  <div class="card-title">${game.name}</div>
                </div>
                <div class="stats-badges">
                  <div class="badge current">Now: <span>${latest}</span></div>
                  <div class="badge">Avg: <span>${avg}</span></div>
                  <div class="badge">Peak: <span>${peak}</span></div>
                </div>
              </div>
              <div class="chart-container">
                <canvas id="${canvasId}"></canvas>
              </div>
            `;
            rowEl.appendChild(card);

            // Chart rendering
            setTimeout(() => {
              const ctx = document.getElementById(canvasId).getContext("2d");
              new Chart(ctx, {
                type: "line",
                data: {
                  datasets: [{
                    data: dataPoints,
                    borderColor: game.color,
                    backgroundColor: game.color + "18",
                    fill: true,
                    borderWidth: 1.7,
                    pointRadius: 0,
                    pointHoverRadius: 4,
                    tension: 0.2
                  }]
                },
                options: {
                  responsive: true,
                  maintainAspectRatio: false,
                  interaction: { mode: "index", intersect: false },
                  plugins: {
                    legend: { display: false },
                    tooltip: {
                      backgroundColor: "#1c212d",
                      titleColor: "#f0f3f6",
                      bodyColor: "#f0f3f6",
                      borderColor: "#2b3244",
                      borderWidth: 1,
                      displayColors: false,
                      callbacks: {
                        label: ctx => `Players: ${ctx.parsed.y}`
                      }
                    }
                  },
                  scales: {
                    x: {
                      type: "time",
                      time: { unit: "hour", displayFormats: { hour: "HH:mm" } },
                      grid: { color: "#232938" },
                      ticks: { color: "#6b7280", maxRotation: 0, font: { size: 9 } }
                    },
                    y: {
                      beginAtZero: true,
                      grid: { color: "#232938" },
                      ticks: { color: "#6b7280", precision: 0, font: { size: 9 }, maxTicksLimit: 4 }
                    }
                  }
                }
              });
            }, 0);
          });

          layoutEl.appendChild(rowEl);
        });

      } catch (err) {
        statusEl.textContent = `Error loading data: ${err.message}`;
      }
    }

    initDashboard();
  </script>
</body>
</html>
